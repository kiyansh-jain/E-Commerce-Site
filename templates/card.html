<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Payment | TechMarket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card" style="max-width: 500px;">
            <div class="auth-header">
                <span class="auth-icon">💳</span>
                <h1>Card Payment</h1>
                <p>Enter your credit or debit card credentials</p>
            </div>

            <!-- Total Amount Pill -->
            <div style="background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.30); border-radius: var(--r-md); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <span style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Total Amount:</span>
                <span style="font-size: 20px; font-weight: 800; color: #38bdf8;">₹{{ "{:,}".format(total) }}</span>
            </div>

            <form action="/delivery" method="GET">
                <div class="form-group">
                    <label for="cardNumber">Card Number</label>
                    <input type="text" id="cardNumber" class="form-input" placeholder="4532 •••• •••• 8921" maxlength="19" required autofocus>
                </div>

                <div class="form-group">
                    <label for="cardHolder">Cardholder Full Name</label>
                    <input type="text" id="cardHolder" class="form-input" placeholder="Full Name as on Card" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label for="expiry">Expiry (MM/YY)</label>
                        <input type="text" id="expiry" class="form-input" placeholder="12/28" maxlength="5" required>
                    </div>

                    <div class="form-group">
                        <label for="cvv">CVV / CVC</label>
                        <input type="password" id="cvv" class="form-input" placeholder="•••" maxlength="4" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 10px;">
                    🔒 Pay ₹{{ "{:,}".format(total) }} Securely
                </button>
            </form>

            <div style="text-align: center; margin-top: 22px;">
                <a href="/checkout" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">
                    ← Choose another payment method
                </a>
            </div>
        </div>
    </div>

</body>
</html>
