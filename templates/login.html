<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | TechMarket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-icon">🛍️</span>
                <h1>Welcome Back</h1>
                <p>Sign in to your TechMarket account to continue shopping</p>
            </div>

            {% if success %}
            <div class="alert alert-success">
                <span>✅</span>
                <span>{{ success }}</span>
            </div>
            {% endif %}

            {% if error %}
            <div class="alert alert-error">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/check_login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="Enter your username" 
                        value="{{ username or '' }}"
                        required 
                        autofocus 
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Enter your password" 
                        required 
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 10px;">
                    Sign In →
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
                Don't have an account yet? 
                <a href="/register" style="color: #06b6d4; font-weight: 700; text-decoration: none; margin-left: 4px;">
                    Create Account ✨
                </a>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <a href="/" style="color: var(--text-dim); text-decoration: none; font-size: 13px;">
                    ← Back to Homepage
                </a>
            </div>
        </div>
    </div>

</body>
</html>
