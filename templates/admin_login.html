<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Control Panel</title>
  <link rel="stylesheet" href="/static/main.css" />
  <style>
    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(245,158,11,0.18) 0%, rgba(239,68,68,0.18) 100%);
      border: 1px solid rgba(245,158,11,0.4);
      color: #fbbf24;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      margin-bottom: 18px;
    }
    .admin-title {
      font-size: 30px;
      font-weight: 800;
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-bar {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fb7185;
      border-radius: var(--radius-md);
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-admin {
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      color: #fff;
      box-shadow: 0 4px 18px rgba(245,158,11,0.35);
    }
    .btn-admin:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(245,158,11,0.55);
      filter: brightness(1.08);
    }
    .lock-icon {
      font-size: 52px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 12px rgba(245,158,11,0.4));
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card" style="max-width: 420px;">
      <div class="auth-header">
        <div class="lock-icon">🛡️</div>
        <div class="admin-badge">⚡ Admin Access</div>
        <h1 class="admin-title">Control Panel</h1>
        <p>Restricted area — authorized personnel only.</p>
      </div>

      {% if error %}
      <div class="error-bar">
        <span>⚠️</span> {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/admin">
        <div class="form-group">
          <label for="admin-username">Admin Username</label>
          <input
            id="admin-username"
            name="username"
            type="text"
            class="form-input"
            placeholder="Enter admin username"
            autocomplete="off"
            required
          />
        </div>
        <div class="form-group">
          <label for="admin-password">Admin Password</label>
          <input
            id="admin-password"
            name="password"
            type="password"
            class="form-input"
            placeholder="••••••••"
            required
          />
        </div>
        <button id="admin-login-btn" type="submit" class="btn btn-admin btn-full" style="margin-top:8px;">
          🔐 Sign In as Admin
        </button>
      </form>

      <p style="text-align:center; margin-top:22px; font-size:13px; color:var(--text-dim);">
        <a href="/" style="color:var(--text-muted); text-decoration:none;">← Back to Store</a>
      </p>
    </div>
  </div>
</body>
</html>
