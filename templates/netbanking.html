<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Banking | TechMarket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card" style="max-width: 480px;">
            <div class="auth-header">
                <span class="auth-icon">🏦</span>
                <h1>Internet Banking</h1>
                <p>Log in securely through your Bank's internet portal</p>
            </div>

            <!-- Total Amount Pill -->
            <div style="background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.30); border-radius: var(--r-md); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <span style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Order Amount:</span>
                <span style="font-size: 20px; font-weight: 800; color: #38bdf8;">₹{{ "{:,}".format(total) }}</span>
            </div>

            <form action="/delivery" method="GET">
                <div class="form-group">
                    <label for="bankSelect">Select Your Bank</label>
                    <select id="bankSelect" class="form-input" style="background: rgba(6, 12, 28, 0.95); cursor: pointer;">
                        <option value="sbi">State Bank of India (SBI)</option>
                        <option value="hdfc">HDFC Bank</option>
                        <option value="icici">ICICI Bank</option>
                        <option value="axis">Axis Bank</option>
                        <option value="kotak">Kotak Mahindra Bank</option>
                        <option value="pnb">Punjab National Bank</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="userId">NetBanking Customer ID / Username</label>
                    <input type="text" id="userId" class="form-input" placeholder="Enter Bank Customer ID" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">IPIN / Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 10px;">
                    🔑 Login & Authorize ₹{{ "{:,}".format(total) }}
                </button>
            </form>

            <div style="text-align: center; margin-top: 22px;">
                <a href="/checkout" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">
                    ← Choose another payment method
                </a>
            </div>
        </div>
    </div>

</body>
</html>
