<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | TechMarket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-icon">✨</span>
                <h1>Create Account</h1>
                <p>Join TechMarket for exclusive deals and express checkout</p>
            </div>

            {% if error %}
            <div class="alert alert-error">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/save_register" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="Choose a unique username" 
                        value="{{ username or '' }}"
                        required 
                        autofocus 
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Create a strong password" 
                        required 
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 10px;">
                    Register Account →
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
                Already have an account? 
                <a href="/login" style="color: #06b6d4; font-weight: 700; text-decoration: none; margin-left: 4px;">
                    Sign In here
                </a>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <a href="/" style="color: var(--text-dim); text-decoration: none; font-size: 13px;">
                    ← Back to Homepage
                </a>
            </div>
        </div>
    </div>

</body>
</html>
