<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Suspended | TechMarket</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>

  <div class="auth-container">
    <div class="ban-card">
      <div class="ban-icon-wrap">🚫</div>

      <div class="cat-badge cat-red" style="margin-bottom: 16px;">
        ⛔ Account Suspended
      </div>

      <h1 class="ban-title">
        Access <span>Restricted</span>
      </h1>

      <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 16px;">
        Account: <strong style="color: #f1f5f9; background: rgba(255,255,255,0.06); padding: 2px 10px; border-radius: 6px;">{{ username }}</strong>
      </p>

      <div class="ban-reason">
        <div style="font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #f87171; margin-bottom: 6px;">
          Reason for Suspension
        </div>
        <div style="font-size: 13.5px; color: #cbd5e1; line-height: 1.6;">
          Security policy violation or administrative action. Your account access has been suspended to ensure platform security.
        </div>
      </div>

      <div style="margin-bottom: 26px;">
        <span class="cat-badge cat-amber" style="font-size: 11px;">
          🕐 Banned: {{ time_ago }}
        </span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <a href="/" class="btn btn-secondary btn-full">
          ← Back to Homepage
        </a>
      </div>
    </div>
  </div>

</body>
</html>
